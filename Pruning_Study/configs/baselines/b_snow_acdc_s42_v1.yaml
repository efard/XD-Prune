# Frozen publication baseline: SNOW / ACDC snow / seed 42 / version 1
task: detect
mode: train
model: Pruning_Study/models/yolo26n_coco_pretrained.pt
data: Pruning_Study/data_views/acdc_snow_official_v1/acdc_snow.yaml
project: Pruning_Study/results/baselines
name: b_snow_acdc_yolo26n_s42_v1
exist_ok: false

# Training budget and reproducibility
epochs: 100
time: null
patience: 20
batch: 16
imgsz: 640
device: 0
workers: 8
cache: false
seed: 42
deterministic: true
fraction: 1.0
pretrained: true
freeze: null
resume: false
amp: true
compile: false
profile: false
single_cls: false
rect: false
multi_scale: 0.0

# Checkpoints and validation
save: true
save_period: 10
val: true
split: val
plots: true
save_json: false
conf: 0.001
iou: 0.7
max_det: 300
# The trainer forces CUDA epoch-validation FP16 when AMP is enabled.
# Publication metrics are recomputed with eval_common_v1.yaml in FP32.
half: false
dnn: false
augment: false
agnostic_nms: false

# Shared optimizer and schedule
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.9
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.0
cos_lr: false
nbs: 64

# Detection loss weights
box: 7.5
cls: 0.5
dfl: 1.5

# Shared detection augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
copy_paste_mode: flip
close_mosaic: 10
verbose: true
