# Frozen accuracy evaluation for isolated T1/T2 pruning sensitivity.
# Accuracy-affecting settings match eval_research_v2.  Workers, plots and JSON
# export are reduced only to control RAM and artifact volume during 84 runs.
task: detect
mode: val
imgsz: 640
batch: 16
device: 0
workers: 2
split: val
rect: true
conf: 0.001
iou: 0.7
max_det: 300
half: false
dnn: false
augment: false
agnostic_nms: false
cache: false
plots: false
save_json: false
verbose: false
