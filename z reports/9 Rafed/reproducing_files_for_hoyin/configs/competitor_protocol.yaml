experiment: standard_structured_pruning_competitors_v1
architecture: YOLO26n
primary_seed: 42

competitors:
  - global_l1_channel_magnitude
  - standard_torch_pruning_without_dual_domain_ranking
  - random_structured_channel_pruning

pruning:
  unit: dependency_consistent_channel_group
  local_ratio_per_selected_root: 0.25
  target_global_parameter_reduction: 0.1025
  target_rule: closest_dependency_safe_model
  report_exact_achieved_reduction: true
  eligible_roots: ../group_definitions/validated_group_manifest.csv
  protected_roots: ../group_definitions/protected_root_manifest.csv
  whole_layer_replacement: false
  unstructured_zeroing: false

recovery:
  epochs: 20
  batch: 16
  imgsz: 640
  workers: 4
  device: 0
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 1.0
  cos_lr: false
  patience: 0
  amp: true
  deterministic: true
  pretrained: false
  mosaic: 1.0
  close_mosaic: 0
  separate_bn_only_recalibration: false

evaluation:
  config: evaluation_fp32.yaml
  split: val
  imgsz: 640
  batch: 16
  workers: 8
  rect: true
  conf: 0.001
  iou: 0.70
  max_det: 300
  half: false
  augment: false
  agnostic_nms: false

domains:
  GEN:
    checkpoint: ../models/GEN_baseline_best.pt
    dataset: dataset_GEN.yaml
    split_manifest: ../manifests/GEN_MIO_TCD_split_manifest.csv
    train_images: 88000
    val_images: 11000
    test_images: 11000
  SNOW:
    checkpoint: ../models/SNOW_baseline_best.pt
    dataset: dataset_SNOW.yaml
    split_manifest: ../manifests/SNOW_ACDC_split_manifest.csv
    train_images: 400
    val_images: 100
    test_images: 500

required_outputs:
  - exact_parameter_count_before_and_after
  - exact_parameter_reduction_percent
  - gflops_before_and_after
  - map50_95
  - map50
  - map75
  - precision
  - recall
  - checkpoint_sha256
  - selected_roots_or_random_seed
  - pynq_latency_fps_memory_when_available

