# Versioned research-instrumentation companion to sealed eval_common_v1.yaml.
# All accuracy-affecting settings are identical to v1. The only behavioral
# addition is save_json=true so exact post-NMS detections can be preserved.
task: detect
mode: val
imgsz: 640
batch: 16
device: 0
workers: 8
split: val
rect: true
conf: 0.001
iou: 0.7
max_det: 300
half: false
dnn: false
augment: false
agnostic_nms: false
plots: true
save_json: true
verbose: true
